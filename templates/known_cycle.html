{% extends "base.html" %}

{% block content %}

<div class="cycle-container">

  <div class="cycle-card">

    <h2>🌸 Cycle Calculator</h2>
    <p class="subtitle">Enter your details to predict your cycle</p>

    <form method="POST" action="{{ url_for('known_cycle') }}">

      <div class="form-group">
        <label>Last Period</label>
        <input type="date" name="last_period" required>
      </div>

      <div class="form-group">
        <label>Cycle Length (days)</label>
        <input type="number" name="cycle_length" min="21" max="35" placeholder="e.g. 28" required>
      </div>

      <button type="submit" class="btn-floral">
        ✨ Calculate My Cycle
      </button>

    </form>

  </div>

</div>

{% endblock %}
