{% extends "base.html" %}

{% block content %}

<div class="cycle-container">

  <div class="cycle-card">

    <h2>🌸 Cycle Estimator</h2>
    <p class="subtitle">We’ll help estimate your cycle length</p>

    <form method="POST" action="{{ url_for('unknown_cycle') }}">

      <div class="form-group">
        <label>Previous Period</label>
        <input type="date" name="previous_period" required>
      </div>

      <div class="form-group">
        <label>Last Period</label>
        <input type="date" name="last_period" required>
      </div>

      <button type="submit" class="btn-floral">
        ✨ Estimate My Cycle
      </button>

    </form>

  </div>

</div>

{% endblock %}
